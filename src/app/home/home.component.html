<div class="grid min-h-screen grid-cols-1 md:grid-cols-[20%_1fr] items-stretch">
  <!-- Mobile label under nav -->
  <div class="md:hidden pt-14 px-4 pb-2 border-b border-divider">
    <p class="section-label">
      <span appTerminalTyping data-i18n-key="HOME.LABEL">{{ 'HOME.LABEL' | translate }}</span>
    </p>
  </div>

  <app-rail class="self-stretch" [textClass]="'section-label whitespace-nowrap'">
    <span appTerminalTyping data-i18n-key="HOME.LABEL">{{ 'HOME.LABEL' | translate }}</span>
  </app-rail>

  <div class="flex flex-col bg-transparent py-16 md:py-24 md:-ml-[20%] pl-4 pr-4">
    <div class="w-[92%] sm:w-[86%] md:w-[78%] lg:w-[70%] mx-auto">
      <header class="max-w-[24ch]">
        <h2 class="section-title">
          <span appTerminalTyping data-i18n-key="HOME.TITLE">{{ 'HOME.TITLE' | translate }}</span>
        </h2>
      </header>

      <p class="mt-6 max-w-[62ch] text-base md:text-lg leading-relaxed text-secondary">
        {{ 'HOME.SUBTITLE' | translate }}
      </p>

      <!-- Capability list. Deliberately not cards: each entry is a rule, an
           index, a name and a sentence — the structure a spec sheet has. -->
      <ul class="mt-14 md:mt-20 grid grid-cols-1 md:grid-cols-3 border-y border-[var(--color-border)] list-none p-0">
        <li
          *ngFor="let cap of capabilities; let i = index"
          class="px-0 md:px-6 py-8 first:md:pl-0 last:md:pr-0 border-b md:border-b-0 last:border-b-0 md:border-r md:last:border-r-0 border-[var(--color-border)]"
        >
          <span class="font-mono text-xs tracking-[0.18em] text-accent">{{ cap.index }}</span>
          <h3 class="mt-3 font-display text-lg md:text-xl font-semibold tracking-tight text-primary">
            {{ cap.titleKey | translate }}
          </h3>
          <p class="mt-2.5 text-sm leading-relaxed text-secondary">
            {{ cap.bodyKey | translate }}
          </p>
        </li>
      </ul>
    </div>

    <!-- Tech Stack Wheel -->
    <div class="w-full mt-16 md:mt-24">
      <app-tech-stack-wheel></app-tech-stack-wheel>
    </div>
  </div>
</div>
