<header class="nav" [class.nav--scrolled]="scrolled">
  <div class="nav__inner">
    <a href="/" class="nav__brand" (click)="onLogoClick($event)">
      <span class="nav__bracket">&lt;</span>Krupanjac.h<span class="nav__bracket">&gt;</span>
    </a>

    <!-- Mobile controls -->
    <div class="md:hidden flex items-center gap-1">
      <button
        (click)="onAuthClick(); $event.stopPropagation()"
        class="nav__icon-btn"
        title="Open dashboard"
        aria-label="Open dashboard"
        [class.invisible]="!isNavOpen"
        [class.pointer-events-none]="!isNavOpen"
        [attr.aria-hidden]="!isNavOpen"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="9" r="3.2" />
          <path d="M4.5 19c1.6-3.5 5.1-5.5 7.5-5.5s5.9 2 7.5 5.5" />
        </svg>
      </button>
      <button class="nav__icon-btn" (click)="toggleNav()" aria-label="Toggle navigation" [attr.aria-expanded]="isNavOpen" aria-controls="mobile-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path *ngIf="!isNavOpen" d="M4 7h16M4 12h16M4 17h16" />
          <path *ngIf="isNavOpen" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <!-- Desktop navigation -->
    <nav class="nav__links" aria-label="Sections">
      <a *ngFor="let item of sections"
         [href]="'#' + item.id"
         (click)="onNavigate($event, item.id)"
         [attr.aria-current]="activeId === item.id ? 'true' : null"
         class="nav__link">
        {{ item.key | translate }}
      </a>
    </nav>

    <div class="nav__tools">
      <button (click)="onAuthClick()" class="nav__icon-btn" title="Open dashboard" aria-label="Open dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="9" r="3.2" />
          <path d="M4.5 19c1.6-3.5 5.1-5.5 7.5-5.5s5.9 2 7.5 5.5" />
        </svg>
      </button>

      <button class="nav__lang" [disabled]="isLangLoading" (click)="toggleLang()"
              [attr.aria-label]="'Switch language to ' + (currentLang === 'en' ? 'Serbian' : 'English')">
        <span [class.opacity-30]="isLangLoading">{{ currentLang | uppercase }}</span>
      </button>

      <button (click)="toggleTheme()" class="nav__icon-btn"
              [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.2A8.4 8.4 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2Z" />
        </svg>
        <svg *ngIf="theme === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </div>
</header>

  <!-- Dashboard overlay (modal) -->
  <div *ngIf="isDashboardOpen" class="fixed inset-0 z-60 flex items-start justify-center pt-20 bg-black/50" (click)="closeDashboard()">
    <div class="w-full max-w-md mx-4 bg-surface rounded-lg p-6 shadow-lg border border-muted relative" (click)="$event.stopPropagation()">
      <!-- moved close button to top-right and made it absolute so it doesn't affect layout -->
      <button aria-label="Close" class="absolute top-3 right-3 text-sm text-secondary hover:opacity-90" (click)="closeDashboard()">✕</button>

      <div *ngIf="!isAuthenticated">
        <app-login></app-login>
      </div>

      <div *ngIf="isAuthenticated">
        <h3 class="text-lg font-semibold mb-3">Dashboard</h3>
        <p class="text-sm text-secondary mb-4">Signed in as <strong>{{ username }}</strong></p>
        
        <!-- Admin Editor Component -->
        <div class="mb-4">
          <app-admin-editor></app-admin-editor>
        </div>
        
        <button (click)="onLogout()" class="px-3 py-2 bg-danger text-white rounded">Sign out</button>
      </div>

      <div class="mt-4 border-t pt-3">
        <div class="flex items-center gap-2">
          <button class="px-3 py-2 text-sm rounded border border-transparent hover:border-accent" (click)="setLang('en')">EN</button>
          <span class="text-secondary">|</span>
          <button class="px-3 py-2 text-sm rounded border border-transparent hover:border-accent" (click)="setLang('sr')">SR</button>
        </div>
      </div>
    </div>
  </div>

<!-- Mobile dropdown navigation -->
  <div *ngIf="isNavOpen" id="mobile-nav"
    class="md:hidden fixed top-10 left-0 w-full bg-transparent backdrop-blur-[2px] z-[60] shadow-md transition-all duration-300 ease-in-out transform pointer-events-auto"
    [ngClass]="{'translate-y-0 opacity-100': isNavOpen, 'translate-y-[-20px] opacity-0': !isNavOpen}"
    (click)="toggleNav()">
    <nav class="flex flex-col items-center gap-2 p-5" (click)="$event.stopPropagation()">
      <a *ngFor="let item of sections"
         href="javascript:void(0)"
         (click)="onNavigateMobile($event, item.id)"
         [attr.aria-current]="activeId === item.id ? 'true' : null"
         class="nav__link !text-base !px-4 !py-2.5">
        {{ item.key | translate }}
      </a>
  <div class="flex items-center gap-3 pt-2">
  <button class="relative inline-block px-4 py-2 text-sm rounded transition-colors duration-300 disabled:opacity-50 hover:text-accent after:content-[''] after:absolute after:h-[2px] after:w-0 after:bottom-0 after:right-0 after:bg-current after:transition-[width] after:duration-300 hover:after:w-full hover:after:left-0 hover:after:right-auto"
      [ngClass]="theme==='dark' ? 'text-secondary' : 'text-secondary'" [disabled]="isLangLoading" (click)="toggleLang(); toggleNav()" [attr.aria-label]="'Switch language to ' + (currentLang === 'en' ? 'Serbian' : 'English')">
      {{ currentLang | uppercase }}
  </button>
  <svg *ngIf="isLangLoading" class="animate-spin h-4 w-4 text-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
  <button (click)="toggleTheme(); toggleNav()" class="relative inline-block px-4 py-2 text-sm rounded transition-colors duration-300 text-secondary hover:text-accent focus-ring after:content-[''] after:absolute after:h-[2px] after:w-0 after:bottom-0 after:right-0 after:bg-current after:transition-[width] after:duration-300 hover:after:w-full hover:after:left-0 hover:after:right-auto" [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <span *ngIf="theme==='dark'">🌙</span>
        <span *ngIf="theme==='light'">☀️</span>
      </button>
    </div>
  </nav>
</div>
